name: Momin Bhai Zero-Cost Story Series (MoneyPrinterTurbo + AI4Bharat/Indic-Parler-TTS)

on:
  schedule:
    - cron: '0 18 * * *' # Daily at 6:00 PM (BST / Asia-Dhaka)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest # 100% Free Unlimited Minutes on Public Repositories
    steps:
      - name: Checkout Automation Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12 & FFmpeg HD Codecs
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pro 3D Cinema Animation, Bengali Fonts & Multi-Actor Voice Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg imagemagick fonts-noto-core fonts-lohit-beng-bengali
          pip install google-genai edge-tts moviepy faster-whisper google-api-python-client google-auth requests pillow numpy soundfile

      - name: Render 5-6 Min Pro 3D Animated Episode (Next Part / New Story) & Auto-Upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
        run: python auto_pipeline.py
